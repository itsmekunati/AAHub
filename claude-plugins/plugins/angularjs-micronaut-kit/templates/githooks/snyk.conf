# Snyk security checks: TEAM DEFAULTS (committed). Snyk is OFF by default.
#
# Turn Snyk on just for yourself (this clone only, not committed):
#   git config hooks.snyk true                 # master switch on
#   git config hooks.snyk.code true            # also run the code check (uploads source code to Snyk)
#   git config --unset hooks.snyk              # back to the team default
# For a single command:  SNYK=1 git commit ...   (or SNYK=0 to skip once)
# To change the default for everyone, edit this file in a reviewed pull request.
# CI runs its own Snyk checks regardless of these settings.

SNYK_ENABLED=false           # master switch for all Snyk checks
SNYK_DEPENDENCIES=true       # snyk test      - on commit, when dependency files are staged
SNYK_IAC=true                # snyk iac test  - on commit, when deploy/ manifests are staged
SNYK_CODE=false              # snyk code test - on push; uploads source code, so needs approval first
SNYK_SEVERITY=high           # low | medium | high | critical: issues at or above this level block
SNYK_WHEN_UNAVAILABLE=warn   # warn | block: when Snyk is not installed, not signed in or has no network
